[project]
name = "libreta"
version = "0.1.0"
description = "A minimal, prose-first Python notebook"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Daniel" }]
requires-python = ">=3.12"
keywords = ["notebook", "markdown", "literate-programming", "knitr", "rmarkdown"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Science/Research",
    "Natural Language :: Spanish",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "jedi>=0.20.1",
    "starlette>=1.9.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
libreta = "libreta.cli:main"

[project.urls]
Repository = "https://github.com/danielgccr/libreta"

[tool.uv]
default-groups = ["dev", "ejemplos"]  # pandas & co. for the examples, not the package

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.format]
exclude = ["*.md"]  # documents are the user's text: never rewrite their code blocks

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
ejemplos = [
    "pandas>=3.0.6",
]
