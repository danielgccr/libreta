<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ root }} · libreta</title>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/editor.css">
</head>
<body>
  <header class="front">
    <h1 class="title">{{ root }}</h1>
    <p class="date">{{ files|length }} documento{{ "" if files|length == 1 else "s" }}</p>
  </header>
  <main class="index">
    <form class="new" method="post" action="/new">
      <input name="name" value="{{ name }}" placeholder="Nuevo documento: nombre.md" aria-label="Nombre del nuevo documento" autocomplete="off" spellcheck="false"
        {%- if error %} aria-invalid="true" aria-describedby="new-error" autofocus{% endif %}>
      <button>Crear</button>
    </form>
    {% if error %}<p id="new-error" class="new-error" role="alert">{{ error }}</p>{% endif %}
    {% if files %}
    <ol>
      {% for f in files %}
      <li>
        <a href="{{ f.href }}"><span class="folder">{{ f.folder }}</span>{{ f.name }}</a>
        <time datetime="{{ f.iso }}">{{ f.when }}</time>
      </li>
      {% endfor %}
    </ol>
    {% else %}
    <p class="empty">No hay ficheros Markdown en esta carpeta.</p>
    {% endif %}
  </main>
</body>
</html>
