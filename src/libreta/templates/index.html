<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$root · libreta</title>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/editor.css">
</head>
<body>
  <header class="front">
    <h1 class="title">$root</h1>
    <p class="date">$count</p>
  </header>
  <main class="index">
    <form class="new" method="post" action="/new">
      <input name="name" value="$name" placeholder="Nuevo documento: nombre.md" aria-label="Nombre del nuevo documento" autocomplete="off" spellcheck="false"$invalid>
      <button>Crear</button>
    </form>
    $error
    $files
  </main>
</body>
</html>
