$-- Pandoc template for `libreta export` (HTML). No $$highlighting-css$$: export.css
$-- colours the code with the editor's palette.
<!doctype html>
<html$if(lang)$ lang="$lang$"$endif$>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$pagetitle$</title>
$for(css)$
  <link rel="stylesheet" href="$css$">
$endfor$
$for(header-includes)$
  $header-includes$
$endfor$
</head>
<body>
<main>
$if(title)$
<header class="front">
<h1 class="title">$title$</h1>
$if(date)$
<p class="date">$date$</p>
$endif$
</header>
$endif$
$body$
</main>
</body>
</html>
